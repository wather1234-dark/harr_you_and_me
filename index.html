body {

background-size: cover;
    background-position: 50% 30%;
    background-repeat: no-repeat;
}

 .flash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: white;
        z-index: 9999;
        pointer-events: none;

        animation: flash 0.8s ease-out forwards;
    }

    @keyframes flash {
        0% {
            opacity: 1;
        }

        30% {
            opacity: 0;
        }

        45% {
            opacity: 0.8;
        }

        100% {
            opacity: 0;
        }
    }

    button {
    padding: 12px 25px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);

    transition: 0.3s ease;
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
}

button:active {
    transform: scale(0.95);
}

    button{
      position: absolute;
      top: 40%;
      left: 28%;
      transform: translate(30px);

    }

    h{

            -0.5px -1px 0 white,
             0.5px -1px 0 white,
            -0.5px  1px 0 white,
             0.5px  1px 0 white !important;
    }

         </style>
